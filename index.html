<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#E7E7E4" id="theme-color-meta" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Raw" />
    <meta name="description" content="Gym workout logger" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Raw</title>
    <script>
      // Resuelve el modo antes del primer pintado para que no haya destello.
      // Una sola paleta desde el rediseño: aquí ya no se elige nada más.
      (function () {
        try {
          var saved = localStorage.getItem('raw-theme'); // 'light' | 'dark' | 'auto' | null
          var dark = saved === 'dark' ||
            ((!saved || saved === 'auto') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          var m = document.getElementById('theme-color-meta');
          if (m) m.setAttribute('content', dark ? '#121316' : '#E7E7E4');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
