<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#E7E7E4" id="theme-color-meta" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Raw" />
    <meta name="description" content="Raw: registro de fuerza serie a serie para los que entrenan en serio. PR honesto, tu ciclo proyectado en el calendario, nutrición que se explica y un panel para coaches. Beta cerrada — se entra con código." />
    <meta property="og:title" content="Raw — Para los que entrenan en serio." />
    <meta property="og:description" content="Registro de fuerza serie a serie, offline y sin estorbar. PR honesto, ciclo en el calendario y nutrición que se explica." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Raw</title>
    <script>
      // Resuelve el modo antes del primer pintado para que no haya destello.
      // Una sola paleta desde el rediseño: aquí ya no se elige nada más.
      (function () {
        try {
          var saved = localStorage.getItem('raw-theme'); // 'light' | 'dark' | 'auto' | null
          var dark = saved === 'dark' ||
            ((!saved || saved === 'auto') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          var m = document.getElementById('theme-color-meta');
          if (m) m.setAttribute('content', dark ? '#121316' : '#E7E7E4');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <!-- Lo mínimo indexable/legible sin JS: el hero de la landing, duplicado
         a mano. Si cambia el copy de Landing.jsx, cambia también aquí. -->
    <noscript>
      <div style="font-family: system-ui, sans-serif; padding: 32px 20px; max-width: 680px; margin: 0 auto;">
        <p style="font-weight: 900; font-size: 22px; margin: 0 0 24px;">RAW</p>
        <h1 style="font-weight: 900; font-size: 44px; line-height: 1.05; margin: 0;">Para los que entrenan en serio.</h1>
        <p style="font-size: 16px; line-height: 1.55; margin: 18px 0 0; max-width: 46ch;">
          Raw es un registro de fuerza serie a serie, hecho como un instrumento:
          te dice si le ganaste a tu última sesión en el momento, guarda cada
          kilo donde entrenes y cabe en el descanso entre series.
        </p>
        <p style="font-size: 14px; margin: 18px 0 0;">Raw necesita JavaScript para funcionar. Actívalo para entrar.</p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
