<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#EAE7DE" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E0F0C" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Raw" />
    <meta name="description" content="Gym workout logger" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Raw</title>
    <script>
      // Resolve theme before first paint to avoid a flash.
      (function () {
        try {
          var saved = localStorage.getItem('raw-theme'); // 'light' | 'dark' | 'auto' | null
          var dark = saved === 'dark' ||
            ((!saved || saved === 'auto') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
